<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background: full-bleed square, OS applies its own corner mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Phone: mobile money side (Zaad / eDahab) -->
  <rect x="122" y="277" width="260" height="470" rx="54" fill="#FFFFFF"/>
  <rect x="146" y="323" width="212" height="380" rx="26" fill="url(#bg)"/>
  <rect x="224" y="303" width="56" height="8" rx="4" fill="#FFFFFF"/>

  <!-- Forward arrow: auto-forwarding motion -->
  <rect x="452" y="495" width="120" height="34" rx="4" fill="#FFFFFF"/>
  <path d="M552 440 L652 512 L552 584 Z" fill="#FFFFFF"/>

  <!-- Coin: payout destination -->
  <circle cx="762" cy="512" r="140" fill="#FFFFFF"/>
  <circle cx="762" cy="512" r="88" fill="url(#bg)"/>
</svg>
