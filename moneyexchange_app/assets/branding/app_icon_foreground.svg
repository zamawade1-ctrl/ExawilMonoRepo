<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Transparent foreground for Android's adaptive icon. The green comes from
       the separate adaptive_icon_background layer, so the phone body and coin
       centre must be REAL transparent holes (via masks) for the green to show
       through - producing the same outline look as the iOS icon. Using a solid
       inner fill or fill-opacity="0" would instead leave the white filled in.
       Geometry matches app_icon.svg 1:1; flutter_launcher_icons adds its own
       16% inset for the adaptive-icon safe zone. -->
  <defs>
    <mask id="phoneHole">
      <rect x="122" y="277" width="260" height="470" rx="54" fill="#FFFFFF"/>
      <rect x="146" y="323" width="212" height="380" rx="26" fill="#000000"/>
    </mask>
    <mask id="coinHole">
      <circle cx="762" cy="512" r="140" fill="#FFFFFF"/>
      <circle cx="762" cy="512" r="88" fill="#000000"/>
    </mask>
  </defs>

  <!-- Phone: outlined body + speaker slot -->
  <rect x="122" y="277" width="260" height="470" rx="54" fill="#FFFFFF" mask="url(#phoneHole)"/>
  <rect x="224" y="303" width="56" height="8" rx="4" fill="#FFFFFF"/>

  <!-- Forward arrow: solid, same as iOS -->
  <rect x="452" y="495" width="120" height="34" rx="4" fill="#FFFFFF"/>
  <path d="M552 440 L652 512 L552 584 Z" fill="#FFFFFF"/>

  <!-- Coin: outlined ring -->
  <circle cx="762" cy="512" r="140" fill="#FFFFFF" mask="url(#coinHole)"/>
</svg>
